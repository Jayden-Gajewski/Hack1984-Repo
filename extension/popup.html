<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Dossier Privacy Check</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="top">
      <span class="brand">
        <!-- The app's mark: a file folder with a keyhole. -->
        <svg width="18" height="18" viewBox="0 0 26 26" aria-hidden="true">
          <path
            d="M3 8a2.5 2.5 0 0 1 2.5-2.5h4.6l2.2 2.5h8.2A2.5 2.5 0 0 1 23 10.5v8A2.5 2.5 0 0 1 20.5 21h-15A2.5 2.5 0 0 1 3 18.5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <circle cx="13" cy="13.4" r="1.9" fill="currentColor" />
          <path d="M12.2 14.6h1.6l.5 2.8h-2.6Z" fill="currentColor" />
        </svg>
        Dossier
      </span>
      <span id="site" class="site"></span>
    </header>
    <p id="status" class="visually-hidden" aria-live="polite"></p>
    <main id="main">
      <section class="message">
        <p class="working"><span class="spinner" aria-hidden="true"></span>Loading…</p>
      </section>
    </main>
    <footer class="foot">
      <label class="toggle"><input type="checkbox" id="auto" /> Check every site I visit</label>
      <p class="fine">
        Policies are read straight from each site and analyzed on this laptop. Trackers and form
        fields are seen in your browser, and what you type is never read. The sites you visit never
        go to a search engine or a cloud AI.
      </p>
    </footer>
  </body>
</html>
