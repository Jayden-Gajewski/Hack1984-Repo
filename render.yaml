# Render Blueprint for Dossier's backend (docs/DEPLOY.md). The Next.js frontend goes on Vercel.
services:
  - type: web
    name: dossier-api
    runtime: python
    plan: free
    # Deployed from the repo root, not backend/: the extension download (/api/extension.zip) is built
    # from extension/ on each request, and Render hides files outside a service's root directory.
    buildCommand: pip install -r backend/requirements.txt
    # One process on purpose: each account's current scan is kept in memory (saved scans are in Postgres).
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    buildFilter: # redeploy only when the backend or the extension changes
      paths:
        - backend/**
        - extension/**
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: SITE_URL # the Vercel address, e.g. https://dossier-yourname.vercel.app (no trailing slash)
        sync: false
      - key: DATABASE_URL # hosted Postgres ending in ?sslmode=require, e.g. from Neon
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
